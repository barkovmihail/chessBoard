<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Шахматные задачи · chessBoard</title>
<style>
*{box-sizing:border-box}body{--bg:#f5f1e8;--panel:#fffcf5;--ink:#312e27;--muted:#686456;--accent:#a23d26;--tint:#f4dfd2;--line:#d8d0c3;--light:#f1dfc4;--dark:#b48a6c;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,-apple-system,BlinkMacSystemFont,sans-serif}body.club{--bg:#eaf0ea;--panel:#f8fbf6;--ink:#1a332b;--muted:#496556;--accent:#15604b;--tint:#d6e9d4;--line:#b7cdbf;--light:#edf0d7;--dark:#91aa88}body.night{--bg:#181a23;--panel:#222631;--ink:#eff1ff;--muted:#b5bbcf;--accent:#c6b7ff;--tint:#363246;--line:#44495b;--light:#dce0ef;--dark:#898fae}button,a{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.icon{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}header,nav,nav span,.brand,.tag,.tools,button.action{display:flex;align-items:center}header{gap:42px;padding:0 4vw;border-bottom:1px solid var(--line);height:66px;background:var(--panel)}.brand{font-size:25px;letter-spacing:-1.4px;gap:7px}.brand img{width:32px}.night .brand img{filter:invert(1)}nav{gap:20px}nav span,.tools{gap:7px}nav .current{color:var(--accent);font-weight:700}.tools{margin-left:auto;gap:18px}main{max-width:1020px;margin:26px auto;padding:0 22px}h1{font:normal clamp(34px,4.2vw,55px)/1.08 Georgia,serif;letter-spacing:-.05em;margin:0 0 18px}.layout{display:grid;grid-template-columns:minmax(0,1.48fr) minmax(230px,1fr);gap:25px;align-items:start}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;max-height:58vh;width:min(100%,58vh);overflow:hidden;border-radius:3px}.square{border:0;margin:0;padding:0;background:var(--light);position:relative}.square.d{background:var(--dark)}.square.on{box-shadow:inset 0 0 0 4px var(--accent)}.square img{position:absolute;width:95%;height:95%;inset:2.5%}.square small{position:absolute;bottom:0;left:2px;font-size:9px;color:#292a24}.layout{grid-template-columns:minmax(0,min(58vh,54%)) 1fr}.panel{border-top:3px solid var(--accent);padding:20px;background:var(--panel)}.tag{gap:8px;color:var(--accent);font-weight:650}.panel h2{font-size:30px;letter-spacing:-1.4px;margin:17px 0 5px}.panel p{color:var(--muted);margin:0 0 22px}.meta{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line)}.action{justify-content:center;gap:9px;background:var(--accent);color:var(--panel);border:0;border-radius:6px;padding:12px;width:100%;font-weight:650;margin-top:12px}.night .action{color:#211e2c}.club header{position:absolute;inset:0 auto 0 0;width:175px;height:auto;flex-direction:column;align-items:flex-start;gap:40px;padding:23px 14px;background:#193d32;color:#f4f7ee}.club header img{filter:invert(1)}.club nav{display:grid;width:100%;gap:8px}.club nav span{padding:10px}.club nav .current{background:#325546;color:white;border-radius:8px}.club .tools{margin:auto 0 0}.club main{margin-left:max(185px,calc((100vw - 680px)/2));margin-right:20px}.club h1,.night h1{font-family:inherit;font-weight:650}.club .panel,.club .board{border-radius:14px}.club .panel{border:1px solid var(--line)}.club .action{border-radius:24px}.night .layout{grid-template-columns:1fr minmax(0,min(58vh,54%))}.night .board{grid-column:2;grid-row:1}.night .panel{grid-row:1}.night .meta{font-family:monospace}.night .board{border:4px solid #343847}.night header{background:var(--bg)}footer{max-width:1020px;padding:14px 22px;margin:auto;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:13px}footer [aria-current]{color:var(--accent);font-weight:bold}#feedback{margin:12px 0 0;color:var(--ink)}#feedback:empty{display:none}@media(max-width:740px){header,.club header{position:static;width:auto;height:auto;padding:12px 16px;flex-direction:row;align-items:center;gap:8px;flex-wrap:wrap}.club header nav,header nav{display:flex;order:3;width:100%;gap:12px;flex-wrap:wrap;font-size:13px}nav span,.club nav span{padding:3px 0}.tools,.club .tools{margin:0 0 0 auto}.club main,main{margin:16px auto;padding:0 14px}.layout,.night .layout{display:flex;flex-direction:column;gap:12px}.board,.panel{width:100%;max-height:none}.board{max-width:min(100%,56vh);align-self:center}.panel{padding:14px}.panel h2{margin:6px 0}.panel p{margin-bottom:8px}}
</style>
<header><div class="brand"><img src="logo-options/knights/staunton.svg" alt=""><span><b>chess</b>Board</span></div><nav aria-label="Разделы макета"></nav><div class="tools"></div></header>
<main><h1>Шахматные задачи</h1><div class="layout"><div class="board" aria-label="Шахматная доска"></div><section class="panel"><div class="tag"></div><h2>Найдите мат в один ход</h2><p>Ход белых</p><div class="meta"><span>Тема</span><b>Атака на короля</b></div><div class="meta"><span>Сложность</span><b>Начальная</b></div><button class="action"></button><p id="feedback" role="status"></p></section></div></main><footer aria-label="Варианты дизайна"><a href="?style=paper">Бумага и глина</a><a href="?style=club">Зелёный клуб</a><a href="?style=night">Ночная студия</a></footer>
<script>
const style=new URLSearchParams(location.search).get('style');
document.body.className=['club','night'].includes(style)?style:'paper';
document.querySelector('footer a[href="?style='+document.body.className+'"]').setAttribute('aria-current','page');
const paths={
 play:'M3 3h18v18H3z M3 12h18 M12 3v18 M4 4h7v7H4z M13 13h7v7h-7z',
 puzzles:'M4 6h5a3 3 0 1 1 6 0h4v5a3 3 0 1 0 0 6v3H4v-5a3 3 0 1 0 0-6z',
 book:'M12 6Q7 3 2 5v14q5-2 10 1 5-3 10-1V5q-5-2-10 1v14',
 analysis:'M3 3v17h18 M6 15l4-5 4 2 6-8',
 bell:'M4 17h16l-2-3V9a6 6 0 0 0-12 0v5z M10 20q2 3 4 0',
 profile:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z M15 9a3 3 0 1 1-6 0 3 3 0 0 1 6 0z M6 18q6-8 12 0',
 bulb:'M9 16c0-3-3-3-3-7a6 6 0 1 1 12 0c0 4-3 4-3 7z M9 19h6 M11 22h2',
 retry:'M4 4v6h6 M4 10a8 8 0 1 1 0 5',
 target:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z'};
function icon(k){return '<svg aria-hidden="true" class="icon" viewBox="0 0 24 24"><path d="'+paths[k]+'"/></svg>'}
for(const [k,label] of Object.entries({play:'Игра',puzzles:'Задачи',book:'Дебюты',analysis:'Анализ'}))document.querySelector('nav').insertAdjacentHTML('beforeend','<span class="'+(k==='puzzles'?'current':'')+'">'+icon(k)+label+'</span>');
for(const [k,label] of [['bell','Уведомления'],['profile','Профиль']])document.querySelector('.tools').insertAdjacentHTML('beforeend','<span role="img" aria-label="'+label+'" title="'+label+'">'+icon(k)+'</span>');
document.querySelector('.tag').innerHTML=icon('target')+'Тактика';
let chosen=false, solved=false;
const board=document.querySelector('.board'),action=document.querySelector('.action'),feedback=document.querySelector('#feedback');
function draw(){
 board.replaceChildren();action.innerHTML=solved?icon('retry')+'Повторить позицию':icon('bulb')+'Подсказка';
 const fen=solved?'r1bqkb1r/pppp1Qpp/2n2n2/4p3/2B1P3/8/PPPP1PPP/RNB1K1NR':'r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR';
 fen.split('/').forEach((row,r)=>{let col=0;for(const char of row)for(let n=0;n<(Number(char)||1);n++){
 const coord='abcdefgh'[col]+(8-r),cell=document.createElement('button');cell.className='square'+((r+col)%2?' d':'');cell.setAttribute('aria-label',coord);
 if(!Number(char)){const img=new Image();img.alt='';img.src='../../public/pieces/merida/'+(char===char.toUpperCase()?'w':'b')+char.toUpperCase()+'.svg';cell.append(img)}
 if(!col||r===7){const label=document.createElement('small');label.textContent=(!col?8-r:'')+(r===7?'abcdefgh'[col]:'');cell.append(label)}
 cell.onclick=()=>{if(solved)return;if(coord==='h5'){chosen=true;cell.classList.add('on');feedback.textContent='Ферзь выбран.'}else if(chosen&&coord==='f7'){solved=true;chosen=false;draw();feedback.textContent='Мат! Ферзя на f7 защищает слон c4.'}else{feedback.textContent='Попробуйте другой ход.'}};board.append(cell);col++}})}
action.onclick=()=>{if(solved){solved=false;feedback.textContent='';draw()}else feedback.textContent='Слон c4 атакует f7. Какая ещё фигура может попасть на это поле?'};draw();
</script></html>
